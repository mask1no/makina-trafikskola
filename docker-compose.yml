services:
  postgres:
    image: postgres:16
    container_name: makina-db
    environment:
      POSTGRES_USER: makina
      POSTGRES_PASSWORD: makina_local_dev
      POSTGRES_DB: makina
    ports:
      - "5433:5432"
    volumes:
      - makina-postgres:/var/lib/postgresql/data

volumes:
  makina-postgres:
