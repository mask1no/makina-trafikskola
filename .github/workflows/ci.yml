name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: makina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d makina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/makina_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CRON_SECRET: ci-only-cron-secret
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Booking concurrency integration tests
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:concurrency

      - name: Stripe webhook replay integration test
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:webhook-replay

      - name: Translation parity
        run: npm run check:translations

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
